<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="preload"
      href="/fonts/sf-pro-display-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sf-pro-display-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="author" content="Théo Gouman" />
    <meta name="application-name" content="La Relève" />
    <meta name="description" content="L'accès à cet espace a été restreint." />
    <title>Accès restreint</title>
    <script>
      // Applique le thème avant le rendu (évite le flash clair/sombre).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
